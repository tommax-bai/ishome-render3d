[project]
name = "render3d-svc"
version = "0.1.0"
description = "三维管线 worker：scene-compile / base-render（场景编译与底渲），GPU + 三维引擎伸缩轴（V1.4 物理拆分）"
requires-python = ">=3.12"
dependencies = [
  "ishome-contracts",
  "temporalio>=1.8",
  "pydantic>=2.9",
  # 底渲出的是几何/深度/线稿/遮罩四路控制图，不是写实图——写实化归 imagegen 的 realism-pass。
  # 这四路是确定性光栅（同 render2d"同一份几何画两次要逐字节相同"的口径），
  # 所以走纯 Python + numpy 软光栅，不引系统级渲染栈与 GPU 依赖。
  "numpy>=2.1",
  "pillow>=11",
]

[project.scripts]
render3d-worker = "render3d_worker.worker:main"
render3d = "render3d_worker.cli:main"

[tool.uv.sources]
ishome-contracts = { git = "ssh://git@github.com/tommax-bai/ishome-contracts.git", tag = "v0.2.0", subdirectory = "gen/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render3d_worker"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

# ---------------------------------------------------------------------------
# ruff（lint + format）——口径同 ishome-aipipe 根配置
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# mypy（strict）
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# import-linter：模块依赖方向契约（违规挂质量门）。
# 规则来源：《开发规范与代码分层》§1.3；禁 utils/common/helpers 目录。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["render3d_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "worker|cli → activities → scene_compile|base_render → mesh|raster → models 单向"
type = "layers"
# 两个入口同层且互不可见（"|" = independent siblings）：`worker` 是 Temporal 入口，
# `cli` 是本地一条命令出图的工具入口。**cli 不许经 activities**——它是不碰 Temporal 与对象存储的那条路，
# 从它能看见 activities 起，"本地渲一张图不需要起编排"就只是一句承诺而不是结构。
#
# `scene_compile`（编场景包）与 `base_render`（底渲）是两个 activity 各自的域，互不可见：
# 编场景包不该知道怎么渲，底渲只吃编好的场景包、不该反过来编。各自只向下依赖。
# `mesh`（2D 几何 → 三维网格构建）与 `raster`（软光栅核心）同样互不可见：
# 建网格不挑光栅口径，光栅只吃网格、不管它从哪张户型图长出来。
# `models` 是最底层的纯契约，谁都可以看见它，它谁也看不见。
layers = [
  "worker | cli",
  "activities",
  "scene_compile | base_render",
  "mesh | raster",
  "models",
]
containers = ["render3d_worker"]
